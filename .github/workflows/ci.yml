name: CI

on:
  push:
  pull_request:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n MacBookVerify.command
          bash -n Install.command
          bash -n scripts/verify.sh
      - name: Verify project structure
        run: |
          test -x MacBookVerify.command
          test -x Install.command
          test -x scripts/verify.sh
          test -f docs/CHECKS.md
          grep -q 'MacBook Verify' README.md
