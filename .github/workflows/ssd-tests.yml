name: MacBook Verify Diagnostics Tests
on:
  pull_request:
  push:
    branches: [main, feat/ssd-deep-health, feat/drive-health-coverage-v12, feat/deep-ssd-battery-diagnostics-v13, feat/pro-inspection-v20-vi]
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: |
          python -m py_compile scripts/ssd_diagnostics.py scripts/ssd_health_engine.py
          python -m py_compile scripts/apple_coverage.py scripts/ssd_monitor_agent.py
          python -m py_compile scripts/battery_diagnostics.py scripts/storage_probe.py
          python -m py_compile scripts/pro_inspection.py scripts/battery_discharge.py scripts/compare_macs.py
      - name: Unit tests (offline fixture data)
        run: python -m unittest discover -s tests -v
      - name: RAM native helper (bounded 2 MiB)
        run: |
          cc -O2 helpers/memory_test.c -o "$RUNNER_TEMP/memory_test"
          "$RUNNER_TEMP/memory_test" 2
      - name: Metal Swift compiler check
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -O helpers/metal_gpu_test.swift -o "$RUNNER_TEMP/metal_gpu"
      - name: Shell syntax
        run: |
          bash -n MacBookVerify.command
          bash -n CheckAppleCoverage.command
          bash -n scripts/verify.sh
          bash -n scripts/report.sh
          bash -n scripts/collectors/static.sh
          bash -n scripts/tests/active.sh
      - name: macOS non-invasive report smoke test
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/mbv-smoke"
          ./MacBookVerify.command --static-only --no-open --output "$RUNNER_TEMP/mbv-smoke"
          python -c '
          import glob,json,os
          root=os.environ["RUNNER_TEMP"] + "/mbv-smoke"
          paths=glob.glob(root + "/MacBook-Verify-*/summary.json")
          assert paths, "Missing summary.json"
          payload=json.load(open(paths[-1]))
          assert "apple_coverage" in payload
          folder=os.path.dirname(paths[-1])
          assert os.path.isfile(folder+"/report.html")
          assert os.path.isfile(folder+"/ssd-report.html")
          assert os.path.isfile(folder+"/apple-coverage.html")
          assert os.path.isfile(folder+"/apple-coverage.json")
          assert os.path.isfile(folder+"/battery-report.html")
          assert os.path.isfile(folder+"/battery-report.json")
          assert "ssd_deep" in payload and "battery_deep" in payload
          assert "gpu_name" in payload and "gpu_cores" in payload
          assert os.path.isfile(folder+"/system-information.html")
          assert os.path.isfile(folder+"/system-information.json")
          sysinfo=json.load(open(folder+"/system-information.json"))
          assert sysinfo.get("collection",{}).get("status")=="PASS", sysinfo.get("collection")
          assert sysinfo.get("system_profiler",{}).get("SPHardwareDataType"), "Missing macOS hardware inventory"
          assert os.path.isfile(folder+"/compare-macs.html")
          assert os.path.isfile(folder+"/battery-discharge.html")
          print("macOS report smoke test OK: " + folder)
          '
